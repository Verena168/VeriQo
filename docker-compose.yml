services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: veriqo
      POSTGRES_PASSWORD: veriqo
      POSTGRES_DB: veriqo
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  mongo:
    image: mongo:8
    ports: ["27017:27017"]
    volumes: [mongodata:/data/db]

volumes:
  pgdata:
  mongodata:
